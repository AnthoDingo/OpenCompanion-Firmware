; Waveshare ESP32-S3-LCD-1.69 (ESP32-S3R8, écran ST7789V2 240x280 intégré).
[env:esp32s3_lcd169]
; core Arduino 2.x : TFT_eSPI n'est pas encore fiable sur le core 3.x
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = bodmer/TFT_eSPI@^2.5.43
; USB natif en mode TinyUSB : HID (statut) + CDC (téléversement, debug)
build_unflags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
  -D ARDUINO_USB_MODE=0
  -D ARDUINO_USB_CDC_ON_BOOT=0
  ; carte V2 (étiquette « V2QC ») ; ancienne version : SYS_EN_PIN=35, BUZZER_PIN=33
  -D SYS_EN_PIN=41
  -D BUZZER_PIN=42
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  ; 240x280 : TFT_eSPI applique le décalage de 20 lignes du ST7789V2
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=280
  ; broches internes de l'écran (doc Waveshare)
  -D TFT_MISO=-1
  -D TFT_MOSI=7
  -D TFT_SCLK=6
  -D TFT_CS=5
  -D TFT_DC=4
  -D TFT_RST=8
  -D TFT_BL=15
  -D TFT_BACKLIGHT_ON=HIGH
  ; retirer si les couleurs sont inversées
  -D TFT_INVERSION_ON=1
  ; évite le plantage de TFT_eSPI au démarrage sur ESP32-S3
  -D USE_HSPI_PORT=1
  -D LOAD_GLCD=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=40000000
