name: firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install platformio
      - run: pio run
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/*/firmware.bin
      # tag vX.Y (= FW_VERSION 0xXY0 de src/main.cpp) : signe et publie firmware.bin, installé par l'appli TeamsCompanion.
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.FIRMWARE_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo "secret FIRMWARE_SIGNING_KEY manquant"; exit 1; }
          cp .pio/build/*/firmware.bin firmware.bin
          # Signature détachée ECDSA P-256 / SHA-256 (DER), vérifiée dans l'appli avec la clé publique embarquée.
          printf '%s' "$SIGNING_KEY" > signing.pem
          openssl dgst -sha256 -sign signing.pem -out firmware.bin.sig firmware.bin
          rm -f signing.pem
          gh release create "$GITHUB_REF_NAME" firmware.bin firmware.bin.sig --generate-notes
